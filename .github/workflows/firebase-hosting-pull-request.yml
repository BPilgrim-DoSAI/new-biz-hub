name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      # Opt actions that haven't yet shipped a Node 24 release (notably
      # FirebaseExtended/action-hosting-deploy@v0) into running on Node 24.
      # Node 20 is being deprecated by GitHub Actions on 2026-06-16 and
      # removed on 2026-09-16. This flag is GitHub-supported and lets us
      # stay current without waiting for every action maintainer.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      # Fail fast with a clear message if package.json was changed without
      # running 'npm install' to regenerate the lockfile. Without this step,
      # the next 'npm ci' fails with cryptic "Missing X from lock file"
      # errors that take a minute to recognise as a lockfile-drift issue.
      - name: Verify package-lock.json matches package.json
        run: |
          if [ ! -f package.json ] || [ ! -f package-lock.json ]; then
            echo "No package.json or package-lock.json; skipping lockfile check"
            exit 0
          fi
          if ! npm ci --dry-run --no-audit --no-fund > /dev/null 2>&1; then
            echo "::error::package-lock.json is out of sync with package.json."
            echo "::error::This happens when package.json is edited but 'npm install'"
            echo "::error::wasn't run to regenerate the lockfile. To fix:"
            echo "::error::  1. git pull (in case the lockfile was updated by someone else)"
            echo "::error::  2. npm install (regenerates the lockfile)"
            echo "::error::  3. git add package-lock.json && git commit && git push"
            npm ci --no-audit --no-fund 2>&1 | tail -30 || true
            exit 1
          fi
          echo "Lockfile verified in sync with package.json."
      - name: Install build dependencies
        run: npm ci
      - name: Build (compile JSX to js/dist)
        run: npm run build
      # Verify Subresource Integrity hashes match the actual CDN bytes.
      # SRI hashes are silent failure mode — if a Firebase SDK or React
      # version is bumped in HTML without regenerating the hash, the
      # browser refuses to load the script and the page goes blank in
      # production. This check catches the mismatch before deploy.
      - name: Verify SRI hashes against CDN
        run: npm run verify:sri
      # Firestore security-rules regression test (cross-agency isolation,
      # admin-tier write gating). Needs a JRE for the emulator; firebase-tools
      # comes via npx, not a project dependency.
      - name: Set up Java (Firestore emulator runtime)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run Firestore rules tests
        run: npx --yes -p firebase-tools firebase emulators:exec --only firestore --project miroma-ai-hub "node scripts/usage/test-rules.mjs"
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MIROMA_AI_HUB }}
          projectId: miroma-ai-hub
